<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow">
        <div class="card-body p-5">
          <div class="mb-4">
            <h1 class="card-title mb-2">
              <i class="bi bi-pencil"></i> Edit Post
            </h1>
            <p class="text-muted">Update your post content</p>
          </div>

          <!-- Loading State -->
          <div *ngIf="isLoading" class="alert alert-info">
            <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            Loading post...
          </div>

          <div *ngIf="!isLoading">
            <!-- Error Message -->
            <div class="alert alert-danger alert-dismissible fade show" role="alert" *ngIf="errorMessage">
              <i class="bi bi-exclamation-circle"></i> {{ errorMessage }}
            </div>

            <form [formGroup]="editPostForm" (ngSubmit)="onSubmit()" *ngIf="currentPost && !errorMessage">
              <!-- Title Field -->
              <div class="mb-3">
                <label for="title" class="form-label">
                  Post Title *
                  <span class="badge bg-secondary float-end">{{ getTitleCharCount() }}/100</span>
                </label>
                <input
                  type="text"
                  id="title"
                  formControlName="title"
                  class="form-control"
                  [class.is-invalid]="isFieldInvalid('title')"
                  placeholder="Enter a descriptive title for your post"
                  maxlength="100"
                />
                <div class="invalid-feedback d-block" *ngIf="isFieldInvalid('title')">
                  {{ getFieldError('title') }}
                </div>
              </div>

              <!-- Department Field -->
              <div class="mb-3">
                <label for="department" class="form-label">Department *</label>
                <select
                  id="department"
                  formControlName="departmentId"
                  class="form-select"
                  [class.is-invalid]="isFieldInvalid('departmentId')"
                >
                  <option value="" disabled>Select a department</option>
                  <option 
                    *ngFor="let dept of departments" 
                    [value]="dept.departmentId"
                  >
                    {{ dept.name }}
                  </option>
                </select>
                <div class="invalid-feedback d-block" *ngIf="isFieldInvalid('departmentId')">
                  {{ getFieldError('departmentId') }}
                </div>
              </div>

              <!-- Content Field -->
              <div class="mb-3">
                <label for="content" class="form-label">
                  Post Content *
                  <span class="badge bg-secondary float-end">{{ getContentCharCount() }}/1000</span>
                </label>
                <textarea
                  id="content"
                  formControlName="content"
                  class="form-control"
                  [class.is-invalid]="isFieldInvalid('content')"
                  placeholder="Write your post content here... Share your thoughts, questions, or information with your colleagues."
                  maxlength="1000"
                  rows="8"
                ></textarea>
                <div class="invalid-feedback d-block" *ngIf="isFieldInvalid('content')">
                  {{ getFieldError('content') }}
                </div>
              </div>

              <!-- Action Buttons -->
              <div class="d-flex gap-3">
                <button
                  type="button"
                  class="btn btn-outline-secondary"
                  (click)="onCancel()"
                  [disabled]="isSubmitting"
                >
                  <i class="bi bi-x"></i> Cancel
                </button>
                <button
                  type="submit"
                  class="btn btn-primary flex-grow-1"
                  [disabled]="!editPostForm.valid || isSubmitting"
                >
                  <span *ngIf="!isSubmitting">
                    <i class="bi bi-check-circle"></i> Save Changes
                  </span>
                  <span *ngIf="isSubmitting">
                    <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                    Saving...
                  </span>
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
