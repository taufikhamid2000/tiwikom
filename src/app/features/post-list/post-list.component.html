<div class="post-list">
  <div class="header">
    <h2>All Posts</h2>
    <button class="btn-create" routerLink="/create-post">+ Create New Post</button>
  </div>

  <div *ngIf="posts.length === 0" class="empty">
    <p>No posts available yet.</p>
  </div>

  <div *ngFor="let post of posts" class="post-card">
    <h3>{{ post.title }}</h3>
    <p class="meta">
      by {{ post.userName }} — {{ post.departmentName }}
      <span class="date">{{ post.createdAt | date: 'mediumDate' }}</span>
    </p>
    <p>{{ post.content }}</p>

    <div class="stats">
      <app-like-button
        [likesCount]="post.likes"
        [isLiked]="false">
      </app-like-button>

      <a [routerLink]="['/post', post.postId]" class="link">View details</a>
      
      <button *ngIf="isPostOwner(post)" class="btn-edit" (click)="editPost(post.postId)">
        ✏️ Edit
      </button>
    </div>
  </div>
</div>
