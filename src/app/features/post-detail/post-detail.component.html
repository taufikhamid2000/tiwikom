<div *ngIf="!post" class="not-found">
  <p>Post not found.</p>
</div>

<div *ngIf="post" class="post-detail">
  <h2>{{ post.title }}</h2>
  <p class="meta">
    by {{ post.userName }} — {{ post.departmentName }}
    <span class="date">{{ post.createdAt | date: 'mediumDate' }}</span>
  </p>

  <p class="content">{{ post.content }}</p>

  <div class="likes">👍 {{ post.likes }} likes</div>

  <div class="actions" *ngIf="isOwner">
    <button class="edit-btn" (click)="editPost()">✏️ Edit Post</button>
  </div>

  <div class="comments-section">
    <h3>Comments</h3>
    <div *ngIf="post.comments.length === 0" class="no-comments">
      <p>No comments yet.</p>
    </div>

    <div *ngFor="let c of post.comments" class="comment">
      <p class="comment-meta">{{ c.userName }} • {{ c.createdAt | date: 'short' }}</p>
      <p>{{ c.content }}</p>
    </div>
  </div>
</div>
